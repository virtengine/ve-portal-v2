name: CI

# This repository had no workflow at all before this file, so nothing ever ran
# install / typecheck / lint / test on a pull request. That is how PR #21 could
# sit open for three days looking MERGEABLE while `resolutions.undici` was
# bumped in package.json without a matching yarn.lock entry: yarn 4 with CI=1
# implies --immutable, so every install failed with YN0028 while the PR still
# reported MERGEABLE (its only checks were SonarCloud and CodeQL, neither of
# which installs).
#
# The immutable install is therefore the FIRST job and is not allowed to be
# skipped: it is the check that catches a package.json/yarn.lock divergence.
#
# SECOND ADDITION, 2026-10-03 (kanban t_20cbdbae): this file was first merged in
# PR #30 and then removed from `develop` by a force-push of that branch, so the
# gate ran for ~1 day and vanished. It is re-landed here byte-identical because
# it had a green run at 37035016737 (PR #29's push, both jobs success, unit tests
# 16m13s wall). Two notes on the conditions that made it disappear:
#
#   * This repo has NO `main` branch. `develop` is the default branch, and it is
#     the only target worth triggering on — hence `branches: [develop]` above.
#   * `develop` carries NO branch protection
#     (GET /branches/develop/protection -> 404 "Branch not protected"), so a
#     force-push rewrites it with no check and no notification. The gate below
#     detects *code* regressions, not branch rewrites; only protection prevents
#     the rewrite, and branch protection is a repo-admin setting = human-only.
#     Tracked for project-steward as t_20cbdbae-followup.

permissions:
  contents: read

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Must match packageManager in package.json (yarn@4.18.0). corepack is used so
  # the runner resolves the exact pinned version rather than whatever is global.
  YARN_VERSION: "4.18.0"

jobs:
  lockfile:
    name: Lockfile (yarn install --immutable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # corepack must be enabled BEFORE setup-node. setup-node's `cache: yarn`
      # shells out to the global yarn while locating the cache directory, and
      # ubuntu-latest ships yarn 1.22.22, which refuses the project outright:
      #   error This project's package.json defines "packageManager": "yarn@4.18.0".
      #   However the current global version of Yarn is 1.22.22.
      # Enabling corepack here (not in a later step) is what fixes it.
      - name: Enable corepack
        run: |
          corepack enable
          corepack prepare yarn@${{ env.YARN_VERSION }} --activate
          yarn --version

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies (immutable)
        run: yarn install --immutable

  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    needs: [lockfile]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable corepack
        run: |
          corepack enable
          corepack prepare yarn@${{ env.YARN_VERSION }} --activate
          yarn --version

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies (immutable)
        run: yarn install --immutable

      - name: Type check (tsc --noEmit)
        run: yarn tsc --noEmit -p tsconfig.json

      - name: Lint (eslint)
        run: yarn lint:check

      - name: Unit tests (vitest --project=unit run)
        run: yarn vitest --project=unit run